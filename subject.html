<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Fauna+One&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="style.css"
    />

    <title>
        Subject | Academic Journal
    </title>

</head>


<body>


    <!-- ========================================
         JOURNAL
    ========================================= -->

    <main class="journal">


        <!-- ========================================
             BACK
        ========================================= -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Academic Journal
        </a>


        <!-- ========================================
             SUBJECT HEADER
        ========================================= -->

        <header class="subject-header">

            <span class="small-title">
                SUBJECT
            </span>

            <h1 id="subject-page-name">
                Subject
            </h1>

            <p
                class="subtitle"
                id="subject-page-description"
            ></p>

            <p
                class="little-note"
                id="subject-page-note"
            ></p>

        </header>


        <!-- ========================================
             ENTRIES
        ========================================= -->

        <section class="entries">

            <div class="entries-heading">

                <h2>
                    Entries
                </h2>

                <button
                    class="add-entry-button"
                    id="add-entry"
                    type="button"
                >
                    + Add Entry
                </button>

            </div>


            <!-- Entries generated by subject.js -->

            <div id="entries-list"></div>


            <!-- Empty subject -->

            <div
                class="entries-empty"
                id="entries-empty"
            >

                <span>
                    NO ENTRIES YET
                </span>

                <p>
                    Nothing has been added to this subject yet.
                </p>

                <p class="little-note">
                    suspiciously empty...
                </p>

            </div>

        </section>


    </main>



    <!-- ========================================
         ENTRY MODAL
    ========================================= -->

    <div
        class="entry-modal"
        id="entry-modal"
    >

        <div class="entry-modal-backdrop"></div>


        <div class="entry-modal-card">


            <!-- Close -->

            <button
                class="modal-close"
                id="entry-modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <!-- Header -->

            <span class="small-title">
                NEW ENTRY
            </span>

            <h2>
                Add Entry
            </h2>


            <!-- Form -->

            <form id="entry-form">


                <!-- TITLE -->

                <div class="form-field">

                    <label for="entry-title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="entry-title"
                        required
                        autocomplete="off"
                        placeholder="Perceptron"
                    />

                </div>


                <!-- TYPE -->

                <div class="form-field">

                    <label for="entry-type">
                        Type
                    </label>

                    <select
                        id="entry-type"
                        required
                    >

                        <option value="Paper">
                            Paper
                        </option>

                        <option
                            value="Project"
                            selected
                        >
                            Project
                        </option>

                        <option value="Assignment">
                            Assignment
                        </option>

                        <option value="Experiment">
                            Experiment
                        </option>

                        <option value="Report">
                            Report
                        </option>

                        <option value="Notes">
                            Notes
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-field">

                    <label for="entry-description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="entry-description"
                        autocomplete="off"
                        placeholder="Feature vectors & classification"
                    />

                </div>


                <!-- LITTLE NOTE -->

                <div class="form-field">

                    <label for="entry-note">

                        Little note

                        <span>
                            optional
                        </span>

                    </label>

                    <input
                        type="text"
                        id="entry-note"
                        autocomplete="off"
                        placeholder="a tiny thought..."
                    />

                </div>


                <!-- ACTIONS -->

                <div class="modal-actions">

                    <button
                        type="button"
                        class="modal-cancel"
                        id="entry-modal-cancel"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="modal-save"
                    >
                        Add Entry
                    </button>

                </div>


            </form>


        </div>

    </div>



    <!-- ========================================
         CONFIRMATION MODAL
    ========================================= -->

    <div
        class="confirm-modal"
        id="confirm-modal"
    >

        <div class="confirm-modal-backdrop"></div>


        <div class="confirm-modal-card">

            <span
                class="small-title"
                id="confirm-label"
            >
                CONFIRM
            </span>


            <h2 id="confirm-title">
                Are you sure?
            </h2>


            <p id="confirm-message"></p>


            <p
                class="confirm-warning"
                id="confirm-warning"
            ></p>


            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-cancel"
                    id="confirm-cancel"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="modal-save"
                    id="confirm-action"
                >
                    Confirm
                </button>

            </div>

        </div>

    </div>



    <!-- ========================================
         SCRIPTS
    ========================================= -->

    <script src="data/journal.js"></script>

    <script src="data/storage.js"></script>

    <script src="subject.js"></script>


</body>

</html>
